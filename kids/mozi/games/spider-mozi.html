<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mozi Rooftop Rumble</title>
<style>
  :root { color-scheme: dark; --ground: #05040a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* Mozi · Rooftop Rumble — a single-file 2D rooftop brawler with original characters.
   Everything (art, sound, music) is generated in code; no downloads, runs offline. */

// ===================================================================== helpers
const W = 1280, H = 720, WORLD_W = 2600, GROUND = 640, GRAV = 0.62, STEP_MS = 1000 / 60, TAU = Math.PI * 2;
const OUT = '#0d0b14';
const FONT = '"Avenir Next Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const wrapAngle = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry32(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ===================================================================== canvas
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let DPR = 1, SC = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  SC = Math.min(cv.width / W, cv.height / H); OX = (cv.width - W * SC) / 2; OY = (cv.height - H * SC) / 2;
}
addEventListener('resize', resize); resize();

// ===================================================================== sound (synthesized)
const SFX = (() => {
  let ac = null, out, sfxBus, musBus, noiseBuf, musicOn = true, playing = false, nextT = 0, step16 = 0;
  const ready = () => ac && ac.state === 'running';
  function unlock() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ac = new AC();
        out = ac.createGain(); out.gain.value = 0.55; out.connect(ac.destination);
        sfxBus = ac.createGain(); sfxBus.connect(out);
        musBus = ac.createGain(); musBus.gain.value = musicOn ? 0.2 : 0; musBus.connect(out);
        noiseBuf = ac.createBuffer(1, (ac.sampleRate * 0.6) | 0, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { /* sound is optional */ }
  }
  function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur); }
  function noise(t, dur, freq, q, peak, type, bus) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); env(g, t, 0.004, peak, dur);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t); s.stop(t + dur + 0.05); return f;
  }
  function tone(t, dur, f0, f1, type, peak, bus) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.004, peak, dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  const play = fn => { if (ready()) try { fn(ac.currentTime); } catch (e) { /* ignore */ } };
  const BASS = [45, 0, 45, 45, 0, 45, 48, 0, 43, 0, 43, 43, 0, 40, 43, 0];
  const SHIFT = [0, 0, -4, -2];
  function stepMusic(i, t) {
    const s = i & 15, bar = (i >> 4) & 3;
    if (s % 4 === 0) tone(t, 0.16, 140, 42, 'sine', 0.8, musBus);
    if (s === 4 || s === 12) noise(t, 0.1, 1900, 0.8, 0.35, 'bandpass', musBus);
    if (s % 2 === 1) noise(t, 0.025, 7000, 0.7, 0.12, 'highpass', musBus);
    const n = BASS[s];
    if (n) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 440 * Math.pow(2, (n + SHIFT[bar] - 69) / 12);
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(1100, t); fl.frequency.exponentialRampToValueAtTime(180, t + 0.13);
      const g = ac.createGain(); env(g, t, 0.004, 0.28, 0.13);
      o.connect(fl); fl.connect(g); g.connect(musBus); o.start(t); o.stop(t + 0.2);
    }
  }
  return {
    unlock,
    hit: big => play(t => { noise(t, big ? 0.16 : 0.08, big ? 900 : 1700, 0.9, big ? 0.9 : 0.55); tone(t, big ? 0.2 : 0.1, big ? 160 : 230, 48, 'sine', big ? 0.9 : 0.55); }),
    block: () => play(t => { tone(t, 0.07, 1300, 700, 'square', 0.18); noise(t, 0.05, 4000, 1, 0.25, 'highpass'); }),
    whoosh: () => play(t => { const f = noise(t, 0.14, 500, 1.2, 0.28); f.frequency.exponentialRampToValueAtTime(2400, t + 0.12); }),
    jump: () => play(t => tone(t, 0.09, 320, 640, 'sine', 0.16)),
    zap: () => play(t => { tone(t, 0.3, 1400, 180, 'sawtooth', 0.2); tone(t, 0.3, 700, 90, 'square', 0.1); }),
    boom: () => play(t => { noise(t, 0.4, 300, 0.7, 0.9, 'lowpass'); tone(t, 0.35, 90, 30, 'sine', 0.9); }),
    pop: () => play(t => { tone(t, 0.08, 500, 1100, 'square', 0.14); noise(t, 0.14, 3000, 0.6, 0.35); }),
    snap: () => play(t => tone(t, 0.12, 1800, 400, 'triangle', 0.25)),
    blip: () => play(t => tone(t, 0.05, 880, 0, 'square', 0.1)),
    ok: () => play(t => { tone(t, 0.08, 660, 0, 'square', 0.12); tone(t + 0.08, 0.12, 990, 0, 'square', 0.12); }),
    ko: () => play(t => { [784, 659, 523, 392].forEach((f, i) => tone(t + i * 0.11, 0.16, f, 0, 'square', 0.18)); tone(t, 0.6, 120, 40, 'sine', 0.8); }),
    bell: () => play(t => { tone(t, 0.5, 880, 0, 'triangle', 0.28); tone(t, 0.5, 1320, 0, 'sine', 0.12); }),
    music(on) { playing = on; },
    toggleMusic() { musicOn = !musicOn; if (musBus) musBus.gain.value = musicOn ? 0.2 : 0; return musicOn; },
    isMusicOn: () => musicOn,
    update() {
      if (!ready() || !playing || !musicOn) return;
      const dt16 = 60 / 116 / 4;
      if (nextT < ac.currentTime) nextT = ac.currentTime + 0.03;
      while (nextT < ac.currentTime + 0.12) { stepMusic(step16, nextT); step16 = (step16 + 1) & 63; nextT += dt16; }
    },
  };
})();

// ===================================================================== input
const KEYS = Object.create(null), TAPS = Object.create(null);
const NO_SCROLL = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash', 'Quote', 'Comma', 'Period', 'Backspace']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return; // leave browser shortcuts alone
  if (!KEYS[e.code]) TAPS[e.code] = true;
  KEYS[e.code] = true;
  if (NO_SCROLL.has(e.code)) e.preventDefault();
  SFX.unlock();
});
addEventListener('keyup', e => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
addEventListener('pointerdown', () => { window.focus(); SFX.unlock(); });
const held = codes => codes.some(c => KEYS[c]);
const tapped = codes => codes.some(c => TAPS[c]);
const clearTaps = () => { for (const k in TAPS) delete TAPS[k]; };

const MENU = { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], ok: ['Enter', 'Space', 'KeyJ', 'KeyF'], back: ['Escape', 'Backspace'] };
const MAPS = {
  solo: { l: ['KeyA', 'ArrowLeft'], r: ['KeyD', 'ArrowRight'], u: ['KeyW', 'ArrowUp'], d: ['KeyS', 'ArrowDown'], jump: ['KeyW', 'ArrowUp', 'Space'], atk: ['KeyJ'], sp: ['KeyK'], mv: ['KeyL'] },
  p1: { l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'], jump: ['KeyW'], atk: ['KeyF'], sp: ['KeyG'], mv: ['KeyH'] },
  p2: { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'], jump: ['ArrowUp'], atk: ['Comma'], sp: ['Period'], mv: ['Slash'] },
};
const NOINPUT = Object.freeze({ l: false, r: false, u: false, d: false, jumpP: false, jumpH: false, atkP: false, spP: false, mvP: false, mvH: false });

// Keyboard controller with a short press buffer, so a button tapped during hit-pause or recovery still counts.
function keyController(map) {
  const buf = { jump: 0, atk: 0, sp: 0, mv: 0 };
  return {
    human: true,
    poll() {
      for (const k in buf) if (buf[k] > 0) buf[k]--;
      if (tapped(map.jump)) buf.jump = 10;
      if (tapped(map.atk)) buf.atk = 10;
      if (tapped(map.sp)) buf.sp = 10;
      if (tapped(map.mv)) buf.mv = 8;
    },
    read() {
      return { l: held(map.l), r: held(map.r), u: held(map.u), d: held(map.d), jumpH: held(map.jump), mvH: held(map.mv),
        jumpP: buf.jump > 0, atkP: buf.atk > 0, spP: buf.sp > 0, mvP: buf.mv > 0 };
    },
    consume() { buf.jump = buf.atk = buf.sp = buf.mv = 0; },
  };
}

// ===================================================================== level
const PLATS = [
  { x1: 0, x2: WORLD_W, y: GROUND, solid: true },
  { x1: 120, x2: 560, y: 430 }, { x1: 470, x2: 604, y: 540 },
  { x1: 818, x2: 900, y: 480 }, { x1: 860, x2: 1180, y: 320 },
  { x1: 1280, x2: 1640, y: 560 }, { x1: 1296, x2: 1624, y: 430 },
  { x1: 1800, x2: 2200, y: 400 }, { x1: 2180, x2: 2292, y: 520 },
  { x1: 2340, x2: 2560, y: 500 },
];
const CABLES = [], ANCHORS = [];
(function buildAnchors() {
  const cable = (x1, y1, x2, y2, sag, n) => {
    const pts = [{ x: x1, y: y1 }];
    for (let i = 1; i < n; i++) { const t = i / n; pts.push({ x: lerp(x1, x2, t), y: lerp(y1, y2, t) + sag * 4 * t * (1 - t) }); }
    pts.push({ x: x2, y: y2 }); CABLES.push(pts); return pts;
  };
  cable(200, 262, 1020, 176, 70, 4).forEach(p => ANCHORS.push(p));
  for (const x of [1250, 1450, 1650, 1850]) ANCHORS.push({ x, y: 126, hook: true });
  cable(2050, 232, 2470, 372, 46, 3).forEach(p => ANCHORS.push(p));
})();

function makeSky() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0d0a26'); gr.addColorStop(0.45, '#3a1f56'); gr.addColorStop(0.72, '#b4507a'); gr.addColorStop(1, '#f39a5c');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const r = mulberry32(7);
  for (let i = 0; i < 140; i++) { g.globalAlpha = 0.25 + r() * 0.75; g.fillStyle = '#fff'; const s = r() < 0.1 ? 2 : 1; g.fillRect(r() * W, r() * H * 0.45, s, s); }
  g.globalAlpha = 1;
  const mx = W * 0.74, my = H * 0.24;
  const glow = g.createRadialGradient(mx, my, 10, mx, my, 170);
  glow.addColorStop(0, 'rgba(255,230,200,0.5)'); glow.addColorStop(1, 'rgba(255,230,200,0)');
  g.fillStyle = glow; g.fillRect(mx - 170, my - 170, 340, 340);
  g.fillStyle = '#ffe9cf'; g.beginPath(); g.arc(mx, my, 46, 0, TAU); g.fill();
  g.fillStyle = 'rgba(200,170,160,0.35)'; g.beginPath(); g.arc(mx - 12, my - 8, 9, 0, TAU); g.arc(mx + 14, my + 12, 6, 0, TAU); g.fill();
  return c;
}
function makeSkyline(seed, w, h, body, lit, dim, minH, maxH, litP) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); const r = mulberry32(seed);
  let x = -20;
  while (x < w) {
    const bw = 40 + r() * 110, bh = minH + r() * (maxH - minH);
    g.fillStyle = body; g.fillRect(x, h - bh, bw + 1, bh);
    if (r() < 0.3) g.fillRect(x + bw * 0.4, h - bh - 20 - r() * 30, 3, 50);
    if (r() < 0.25) g.fillRect(x + bw * 0.2, h - bh - 16, bw * 0.6, 16);
    for (let yy = h - bh + 10; yy < h - 6; yy += 14) for (let xx = x + 6; xx < x + bw - 8; xx += 11) {
      const v = r(); if (v < litP) { g.fillStyle = v < litP * 0.5 ? lit : dim; g.fillRect(xx, yy, 5, 7); }
    }
    x += bw + 2 + r() * 10;
  }
  return c;
}

const ARES = 1.5, ARENA_TOP = 140, ARENA_H = GROUND + 80 + ARENA_TOP;
function makeArena() {
  const c = document.createElement('canvas'); c.width = WORLD_W * ARES; c.height = ARENA_H * ARES;
  const g = c.getContext('2d'); g.scale(ARES, ARES); g.translate(0, ARENA_TOP);
  const r = mulberry32(42);
  const ledgeTop = (x1, x2, y, col) => { g.fillStyle = col; g.fillRect(x1, y, x2 - x1, 7); g.fillStyle = 'rgba(255,255,255,0.28)'; g.fillRect(x1, y, x2 - x1, 2); };
  const railing = (x1, x2, y) => {
    g.strokeStyle = '#2b2c36'; g.lineWidth = 2; g.beginPath();
    for (let x = x1 + 3; x <= x2 - 2; x += 11) { g.moveTo(x, y); g.lineTo(x, y - 20); }
    g.moveTo(x1, y - 20); g.lineTo(x2, y - 20); g.stroke();
  };
  // distant low wall at the back of the street
  g.fillStyle = '#17121f'; g.fillRect(0, 560, WORLD_W, 80);
  for (let x = 10; x < WORLD_W; x += 70) { g.fillStyle = r() < 0.3 ? 'rgba(255,200,120,0.25)' : '#1f1829'; g.fillRect(x, 578, 30, 18); }

  // construction crane (behind the buildings)
  g.strokeStyle = '#8a6a1f'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(1440, GROUND); g.lineTo(1440, 96); g.moveTo(1478, GROUND); g.lineTo(1478, 96); g.stroke();
  g.lineWidth = 1.6; g.beginPath();
  for (let y = GROUND; y > 110; y -= 38) { g.moveTo(1440, y); g.lineTo(1478, y - 19); g.lineTo(1440, y - 38); }
  g.moveTo(1150, 92); g.lineTo(1960, 92); g.moveTo(1150, 108); g.lineTo(1960, 108);
  for (let x = 1150; x < 1960; x += 24) { g.moveTo(x, 108); g.lineTo(x + 12, 92); g.lineTo(x + 24, 108); }
  g.stroke();
  g.fillStyle = '#6f5418'; g.fillRect(1150, 96, 60, 30); g.fillRect(1430, 108, 58, 34);
  g.fillStyle = 'rgba(255,220,140,0.6)'; g.fillRect(1440, 116, 20, 14);
  g.strokeStyle = '#3c3a46'; g.lineWidth = 1.5; g.beginPath();
  for (const x of [1250, 1450, 1650, 1850]) { g.moveTo(x, 108); g.lineTo(x, 120); }
  g.stroke();
  g.fillStyle = '#ff4040'; g.beginPath(); g.arc(1960, 90, 3, 0, TAU); g.fill();

  function building(x1, x2, top, body, trim, opt = {}) {
    g.fillStyle = body; g.fillRect(x1, top, x2 - x1, GROUND - top);
    g.fillStyle = 'rgba(0,0,0,0.2)'; g.fillRect(x2 - 16, top, 16, GROUND - top);
    for (let y = top + 30; y < GROUND - 44; y += 42) for (let x = x1 + 18; x < x2 - 34; x += 36) {
      const lit = r() < 0.42;
      if (lit) { g.fillStyle = 'rgba(255,210,120,0.14)'; g.fillRect(x - 4, y - 4, 26, 32); }
      g.fillStyle = lit ? (r() < 0.5 ? '#ffd27a' : '#ffbf5e') : 'rgba(10,8,20,0.55)'; g.fillRect(x, y, 18, 24);
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, y + 11, 18, 2);
    }
    g.fillStyle = '#15111c'; g.fillRect((x1 + x2) / 2 - 18, GROUND - 52, 36, 52);
    g.fillStyle = trim; g.fillRect(x1 - 6, top, x2 - x1 + 12, 12);
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(x1 - 6, top, x2 - x1 + 12, 2);
    if (opt.antenna) {
      const a = opt.antenna; g.strokeStyle = '#7d7f8c'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(a.x, top); g.lineTo(a.x, a.y); g.stroke();
      g.lineWidth = 1.5; g.beginPath(); g.moveTo(a.x - 14, top); g.lineTo(a.x, a.y + 60); g.lineTo(a.x + 14, top); g.stroke();
      g.fillStyle = '#ff4a4a'; g.beginPath(); g.arc(a.x, a.y - 4, 4, 0, TAU); g.fill();
    }
    if (opt.flag) {
      const fx = opt.flag; g.strokeStyle = '#9a9cab'; g.lineWidth = 3; g.beginPath(); g.moveTo(fx, top); g.lineTo(fx, 368); g.stroke();
      g.fillStyle = '#1fb5a5'; g.beginPath(); g.moveTo(fx, 374); g.lineTo(fx - 46, 386); g.lineTo(fx, 400); g.fill();
    }
    if (opt.ac) { g.fillStyle = '#5a5d68'; g.fillRect(opt.ac, top - 22, 40, 22); g.fillStyle = '#3d3f48'; g.fillRect(opt.ac + 6, top - 16, 28, 10); }
  }
  building(120, 560, 430, '#4a2b31', '#6b3f45', { antenna: { x: 200, y: 262 }, ac: 400 });
  // fire escape on building A
  ledgeTop(470, 604, 540, '#3b3d48'); railing(470, 604, 540);
  g.strokeStyle = '#3b3d48'; g.lineWidth = 2; g.beginPath(); g.moveTo(578, 547); g.lineTo(578, GROUND); g.moveTo(594, 547); g.lineTo(594, GROUND);
  for (let y = 556; y < GROUND; y += 12) { g.moveTo(578, y); g.lineTo(594, y); } g.stroke();
  building(860, 1180, 320, '#2b3450', '#3d4868', { ac: 1100 });
  ledgeTop(818, 900, 480, '#3b3d48'); railing(818, 900, 480);
  // water tower on building B (its tip is a grapple anchor)
  g.strokeStyle = '#4f341e'; g.lineWidth = 4; g.beginPath();
  g.moveTo(990, 320); g.lineTo(996, 250); g.moveTo(1050, 320); g.lineTo(1044, 250); g.moveTo(990, 300); g.lineTo(1050, 270); g.moveTo(1050, 300); g.lineTo(990, 270); g.stroke();
  g.fillStyle = '#6e4b2c'; g.fillRect(975, 200, 90, 54);
  g.fillStyle = '#4f341e'; g.fillRect(975, 212, 90, 4); g.fillRect(975, 236, 90, 4);
  g.beginPath(); g.moveTo(968, 202); g.lineTo(1072, 202); g.lineTo(1020, 172); g.closePath(); g.fillStyle = '#5a3b22'; g.fill();
  // noodle shop + billboard
  g.fillStyle = '#3a2c45'; g.fillRect(1280, 560, 360, 80);
  g.fillStyle = 'rgba(255,207,110,0.85)'; g.fillRect(1306, 584, 170, 46);
  g.fillStyle = 'rgba(60,30,40,0.6)'; g.fillRect(1306, 606, 170, 3);
  g.fillStyle = '#1a141f'; g.fillRect(1500, 586, 36, 54);
  for (let x = 1286; x < 1636; x += 24) { g.fillStyle = ((x / 24) | 0) % 2 ? '#d94b4b' : '#f3e9e1'; g.fillRect(x, 566, 24, 12); }
  ledgeTop(1280, 1640, 560, '#4b3a58');
  g.font = 'bold italic 22px ' + FONT; g.fillStyle = '#ff6bd6'; g.fillText('NOODLES', 1550, 618);
  g.fillStyle = '#26232f'; g.fillRect(1330, 540, 10, 20); g.fillRect(1580, 540, 10, 20);
  g.fillStyle = '#1b1a26'; g.fillRect(1296, 430, 328, 112);
  const ad = g.createLinearGradient(1304, 440, 1616, 532); ad.addColorStop(0, '#1d8f8a'); ad.addColorStop(1, '#5b2a7a');
  g.fillStyle = ad; g.fillRect(1304, 440, 312, 94);
  g.fillStyle = '#fff3d6'; g.beginPath(); g.arc(1360, 500, 32, 0, Math.PI); g.fill();
  g.strokeStyle = '#fff3d6'; g.lineWidth = 3; g.beginPath(); g.moveTo(1350, 492); g.lineTo(1392, 452); g.moveTo(1362, 492); g.lineTo(1400, 456); g.stroke();

function newDemo() {

function goTitle() { G.mode = 'title'; G.t = 0; G.paused = false; G.match = null; SFX.music(true); }

function startMatch(kind, id1, id2, opts = {}) {
  const m = { kind, id1, id2, round: 1, wins: [0, 0], level: opts.level ?? 2, labels: opts.labels || ['P1', 'P2'] };
  G.match = m; G.mode = 'fight'; G.paused = false; G.t = 0;

}
function startRound(m) {
  const ctrls = m.kind === 'versus' ? [keyController(MAPS.p1), keyController(MAPS.p2)]
    : m.kind === 'arcade' ? [keyController(MAPS.solo), makeAI(m.level)]
      : [makeAI(m.level), makeAI(m.level)];
  const w = makeWorld(m.id1, m.id2, ctrls[0], ctrls[1]);
  w.locked = true; m.world = w; m.phase = 'intro'; m.phaseT = 0; m.timer = 99 * 60; m.loser = null;
  m.banner = { text: `ROUND ${m.round}`, t: 0 };
  m.showHelp = m.kind === 'arcade' && G.arcade && G.arcade.stage === 0 && m.round === 1 ? 420 : 0;
  w.onKO = loser => { if (m.phase === 'play') { m.phase = 'ko'; m.phaseT = 0; m.loser = w.fighters.indexOf(loser); m.banner = { text: 'K.O.!', t: 0, size: 130 }; } };
  SFX.bell();
}
function updateMatch(m) {
  const w = m.world;
  for (const f of w.fighters) if (f.ctrl.poll) f.ctrl.poll();
  stepWorld(w);
  m.phaseT++; if (m.banner) m.banner.t++; if (m.showHelp > 0 && m.phase === 'play') m.showHelp--;
  switch (m.phase) {
    case 'intro':
      if (m.phaseT === 55) { m.banner = { text: 'FIGHT!', t: 0, size: 120 }; SFX.bell(); }
      if (m.phaseT >= 80) { m.phase = 'play'; w.locked = false; }
      break;
    case 'play':
      if (--m.timer <= 0) {
        m.timer = 0; w.locked = true;
        const [a, b] = w.fighters, ra = a.hp / a.ch.hp, rb = b.hp / b.ch.hp;
        m.loser = ra === rb ? -1 : ra < rb ? 0 : 1; m.phase = 'ko'; m.phaseT = 0; m.banner = { text: 'TIME!', t: 0 };
      }
      break;
    case 'ko':
      if (m.phaseT >= 130) {
        w.locked = true;
        if (m.loser >= 0) { m.wins[1 - m.loser]++; m.banner = { text: `${w.fighters[1 - m.loser].ch.name} WINS`, t: 0, hold: true, size: 84 }; }
        else { m.wins[0]++; m.wins[1]++; m.banner = { text: 'DRAW', t: 0, hold: true }; }
        m.phase = 'roundover'; m.phaseT = 0;
      }
      break;
    case 'roundover': {
      if (m.loser >= 0) { const win = w.fighters[1 - m.loser]; if (win.onGround && isFree(win)) setState(win, 'win'); }
      if (m.phaseT >= 150) nextRound(m);

}

function selectInput() {

  }
  const ready = S.twoP ? S.done[0] && S.done[1] : S.done[0];
  if (ready) {
    S.readyT = (S.readyT || 0) + 1;
    if (S.readyT > 24) {

}

    text(hero ? 'Every villain is wrapped up. Nice swinging, Mozi!' : `${CHARS[G.arcade.player].name} rules the rooftops now.`, W / 2, 236, 28, '#ffffff', 'center', { weight: 800 });
    text('Thanks for playing!   ·   Enter: title', W / 2, 290, 22, 'rgba(255,255,255,0.75)', 'center', { weight: 700, italic: false });
  } else {
    const r = G.result, f = m.world.fighters[r.winner];
    text(`P${r.winner + 1} WINS!`, W / 2, 250, 110, r.winner === 0 ? '#5ff0de' : '#ff9a4d', 'center', { weight: 900, stroke: 14 });
    text(`${f.ch.name} takes the rooftop.`, W / 2, 310, 28, '#ffffff', 'center', { weight: 800 });
    text('Enter: rematch   ·   Esc: choose fighters', W / 2, 380, 24, 'rgba(255,255,255,0.8)', 'center', { weight: 700, italic: false });
  }
}

// ===================================================================== main loop
function step() {
  G.t++;
  if (tapped(['KeyM'])) SFX.toggleMusic();
  switch (G.mode) {
    case 'title': SFX.music(true); updateDemo(); titleInput(); break;
    case 'help': updateDemo(); if (tapped(MENU.back) || tapped(MENU.ok)) { G.mode = 'title'; SFX.blip(); } break;
    case 'select': selectInput(); break;
    case 'vs': G.vs.t++; if (G.vs.t > 150 || (G.vs.t > 25 && tapped(MENU.ok))) G.vs.go(); break;
    case 'fight':
      if (tapped(['Escape', 'KeyP'])) { G.paused = !G.paused; SFX.blip(); }
      else if (G.paused && tapped(['Enter'])) G.paused = false;
      else if (G.paused && tapped(['KeyQ'])) { goTitle(); break; }
      if (!G.paused) updateMatch(G.match);
      break;
    case 'gameover':
      stepWorld(G.last.world);
      if (G.t > 30 && tapped(['Enter', 'Space', 'KeyJ'])) arcadeVS(); else if (tapped(MENU.back)) goTitle();
      break;
    case 'ending':
      stepWorld(G.last.world);
      if (G.t > 40 && tapped(['Enter', 'Space', 'KeyJ', 'Escape'])) goTitle();
      break;
    case 'result':
      stepWorld(G.last.world);
      if (G.t > 30 && tapped(['Enter'])) { const m = G.last; showVS(m.id1, m.id2, () => startMatch('versus', m.id1, m.id2, { labels: ['P1', 'P2'] }), 'REMATCH'); }
      else if (tapped(MENU.back)) { G.sel = { twoP: true, c: [ORDER.indexOf(G.last.id1), ORDER.indexOf(G.last.id2)], done: [false, false], t: 0 }; G.mode = 'select'; }
      break;
  }
  clearTaps();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05040a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(SC, 0, 0, SC, OX, OY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  switch (G.mode) {
    case 'title': drawTitle(); break;
    case 'help': drawHelp(); break;
    case 'select': drawSelect(); break;
    case 'vs': drawVS(); break;
    case 'fight': drawFight(); break;
    default: drawEndScreen();
  }
  ctx.restore();
}
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = now - lastT; lastT = now; if (dt > 100) dt = 100;
  acc += dt; let n = 0;
  while (acc >= STEP_MS && n < 4) { step(); acc -= STEP_MS; n++; }
  if (n === 4) acc = 0;
  render();
  SFX.update();
}

const SKY = makeSky();
const FAR = makeSkyline(3, 2400, 320, '#2a2148', 'rgba(255,214,150,0.35)', 'rgba(150,130,200,0.25)', 80, 290, 0.08);
const MID = makeSkyline(11, 2800, 430, '#1a1430', 'rgba(255,200,120,0.75)', 'rgba(120,100,170,0.5)', 120, 400, 0.18);
const ARENA = makeArena();
G.demo = newDemo();
requestAnimationFrame(frame);

// hooks for automated testing
window.__mozi = { G, step, render, startMatch, makeWorld, stepWorld, makeAI, CHARS, ORDER, KEYS, TAPS, MAPS };
</script>
